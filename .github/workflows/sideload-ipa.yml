name: Build iOS sideload IPA

on:
  workflow_dispatch:
    inputs:
      extended_ref:
        description: sing-box-extended branch, tag, or commit
        required: true
        default: extended

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      BASE_PACKAGE_IDENTIFIER: io.nekohasekai.sfamt
      EXTENDED_REPOSITORY: https://github.com/shtorm-7/sing-box-extended.git
    steps:
      - name: Check out client
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Libbox from sing-box-extended
        env:
          EXTENDED_REF: ${{ inputs.extended_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$EXTENDED_REF" "$EXTENDED_REPOSITORY" build/sing-box-extended
          git -C build/sing-box-extended fetch --unshallow --tags
          EXTENDED_VERSION="$(cd build/sing-box-extended && go run ./cmd/internal/read_tag)"
          test "$EXTENDED_VERSION" != unknown
          echo "EXTENDED_VERSION=$EXTENDED_VERSION" >> "$GITHUB_ENV"
          echo "Building sing-box-extended $EXTENDED_VERSION"
          make -C build/sing-box-extended lib_install
          (
            cd build/sing-box-extended
            go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          )
          cp -R build/sing-box-extended/Libbox.xcframework Libbox.xcframework

      - name: Build unsigned app and package IPA
        run: |
          set -euo pipefail
          xcodebuild build \
            -skipPackagePluginValidation \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Unsigned \
            BASE_PACKAGE_IDENTIFIER="$BASE_PACKAGE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP_PATH="build/Unsigned/Build/Products/Release-iphoneos/sing-box.app"
          test -d "$APP_PATH"
          rm -rf build/IPA build/sing-box-unsigned.ipa
          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/
          (
            cd build/IPA
            zip -qry ../sing-box-unsigned.ipa Payload
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-unsigned-ipa
          path: build/sing-box-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$EXTENDED_VERSION"
          NOTES="Unsigned iOS IPA for sideloading.

          Built from sing-box-extended $EXTENDED_VERSION.
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/sing-box-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" build/sing-box-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sing-box $EXTENDED_VERSION" \
              --notes "$NOTES"
          fi
